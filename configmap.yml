apiVersion: v1
kind: ConfigMap
metadata:
  name: unifig-tool-mappings
  namespace: unifig-system
claude-code:
  - unifigPath: AGENTS.md
    filePath: CLAUDE.md
    type: rules
    purpose: Claude-compatible agent instructions
  - unifigPath: commands/*.md
    filePath: .claude/commands/*.md
    type: commands
    purpose: MCP server configurations
  - unifigPath: settings.json
    filePath: .claude/settings.json
    type: settings
    purpose: Project-specific settings and overrides
  - unifigPath: agents/*.md
    filePath: .claude/agents/*.md
    type: agents
    purpose: Project-specific custom agents
  - unifigPath: .mcp.json
    filePath: .mcp.json
    type: mcp settings
    purpose: MCP server configurations

opencode:
  - unifigPath: settings.json
    filePath: opencode.json
    type: settings
    purpose: Project-specific configuration overrides
  - unifigPath: agents/*.md
    filePath: .opencode/agent/*.md
    type: agents
    purpose: Project-specific custom agents
  - unifigPath: commands/*.md
    filePath: .opencode/command/*.md
    type: commands
    purpose: Project-specific custom commands

github-copilot:
  - unifigPath: AGENTS.md
    filePath: .github/copilot-instructions.md
    type: system instructions
    purpose: Repository-wide custom instructions
  - unifigPath: agents/*.md
    filePath: .github/instructions/*.instructions.md
    type: agents
    purpose: Path-specific custom instructions
  - unifigPath: AGENTS.md
    filePath: AGENTS.md
    type: agents
    purpose: AI agent instructions (any directory)
  - unifigPath: AGENTS.md
    filePath: CLAUDE.md
    type: agents
    purpose: Claude-compatible agent instructions
  - unifigPath: AGENTS.md
    filePath: GEMINI.md
    type: agents
    purpose: Gemini-compatible agent instructions

crush-cli:
  - unifigPath: settings.json
    filePath: .crush.json
    type: settings
    purpose: Project-specific configuration
  - unifigPath: settings.json
    filePath: crush.json
    type: settings
    purpose: Alternative project config filename
  - unifigPath: .unifigignore
    filePath: .crushignore
    type: settings
    purpose: Files to exclude from context

cursor:
  - unifigPath: AGENTS.md
    filePath: .cursorrules
    type: system instructions
    purpose: AI rules and coding instructions for the project
  - unifigPath: agents/*.md
    filePath: .cursor/rules/*.md
    type: agents
    purpose: Multiple repository-level rules (Agent auto-selects)
  - unifigPath: agents/*.md
    filePath: .cursor/rules/*.mdc
    type: agents
    purpose: Cursor markdown files with metadata (YAML frontmatter)
  - unifigPath: .mcp.json
    filePath: .cursor/mcp.json
    type: mcp settings
    purpose: Project-specific MCP server configurations
  - unifigPath: .unifigignore
    filePath: .cursorignore
    type: settings
    purpose: Files to exclude from codebase indexing
gemini-cli:
  - unifigPath: AGENTS.md
    filePath: GEMINI.md
    type: rules
    purpose: Project-specific configuration
  - unifigPath: settings.json
    filePath: .gemini.json
    type: settings
    purpose: Project-specific configuration
  - unifigPath: settings.json
    filePath: gemini.json
    type: settings
    purpose: Alternative project config filename
  - unifigPath: .unifigignore
    filePath: .geminiignore
    type: settings
    purpose: Files to exclude from context
  - unifigPath: agents/*.md
    filePath: .gemini/agents/*.md
    type: agents
    purpose: Project-specific custom agents
  - unifigPath: commands/*.md
    filePath: .gemini/commands/*.md
    type: commands
    purpose: Project-specific custom commands

openai-codex:
  - unifigPath: settings.json
    filePath: .codex.json
    type: settings
    purpose: Project-specific configuration
  - unifigPath: .unifigignore
    filePath: .codexignore
    type: settings
    purpose: Files to exclude from context
  - unifigPath: agents/*.md
    filePath: .codex/agents/*.md
    type: agents
    purpose: Project-specific custom agents

continue-dev:
  - unifigPath: settings.json
    filePath: .continue/config.json
    type: settings
    purpose: Project-specific configuration
  - unifigPath: agents/*.md
    filePath: .continue/rules/*.md
    type: agents
    purpose: Project-specific rules
  - unifigPath: commands/*.md
    filePath: .continue/commands/*.md
    type: commands
    purpose: Project-specific custom commands

cline-cli:
  - unifigPath: settings.json
    filePath: .cline.json
    type: settings
    purpose: Project-specific configuration
  - unifigPath: agents/*.md
    filePath: .cline/agents/*.md
    type: agents
    purpose: Project-specific custom agents
  - unifigPath: commands/*.md
    filePath: .cline/commands/*.md
    type: commands
    purpose: Project-specific custom commands